plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 目标 CPU 架构。
// jlibtorrent 是「一个 ABI 一个构件」的，四个都打进同一个 APK 会让包体变成 ~50MB。
// 默认只带 arm64-v8a（2018 年以后几乎所有手机都是），需要别的架构时改这一行：
//   ./gradlew assembleRelease -Pabis=arm64-v8a,armeabi-v7a
// 或用 tools/build.ps1 -Abis "arm64-v8a,armeabi-v7a"
// ---------------------------------------------------------------------------
def targetAbis = (project.findProperty('abis') ?: 'arm64-v8a')
        .toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }

// BitTorrent 内核版本。libtorrent4j 是 libtorrent 的 Java 绑定，org.libtorrent4j 分支
// 仍在活跃维护（2.1.0-39 对应 libtorrent 2.0.x 内核，支持 v2/hybrid torrent）。
def libtorrentVersion = '2.1.0-39'

android {
    namespace 'com.magnetrush.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.magnetrush.app"
        minSdk 24               // Android 7.0，覆盖 DHT / uTP / 协议加密全部特性
        targetSdk 34            // Android 14
        versionCode 1
        versionName "1.0.0"

        resConfigs "zh", "en"
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters.addAll(targetAbis)
        }
    }

    signingConfigs {
        // 仅用于「未配置 release 密钥」时的兜底，让 assembleRelease 也能出可安装包。
        // 正式发布请用 -PksPath / -PksPass / -PksAlias / -PksKeyPass 传入自己的 keystore。
        if (project.hasProperty('ksPath')) {
            release {
                storeFile file(project.property('ksPath'))
                storePassword project.property('ksPass')
                keyAlias project.property('ksAlias')
                keyPassword project.property('ksKeyPass')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
        }
        release {
            minifyEnabled false          // 见下方说明：libtorrent 是 JNI 封装，关闭混淆最稳
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('ksPath')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false   // Android 10+ 直接从 APK 映射 .so，省一份解压空间
            // 不要用 NDK 的 strip 处理 libtorrent：它是第三方预编译库，
            // 剥符号有极小概率影响调试符号回溯，对体积收益也不大。
            keepDebugSymbols += ['**/libjlibtorrent.so']
            pickFirsts += ['lib/**/libjlibtorrent.so']
        }
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'

    // --- BitTorrent 内核：libtorrent 的 Java 绑定 ---
    // 每个 ABI 一个独立构件（各自的 .so 只放在对应目录），靠上面的 abiFilters
    // 决定最终打哪个进包，所以四个都声明也不会让 APK 变大。
    // 注意：包名是 org.libtorrent4j，不是 com.frostwire.jlibtorrent（那是另一个旧分支）。
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:${libtorrentVersion}"
    implementation "org.libtorrent4j:libtorrent4j-android-arm:${libtorrentVersion}"
    implementation "org.libtorrent4j:libtorrent4j-android-x86:${libtorrentVersion}"
    implementation "org.libtorrent4j:libtorrent4j-android-x86_64:${libtorrentVersion}"

    // 注意：这里刻意没有引入协程。引擎是命令队列式设计，
    // 服务里用一个 ScheduledExecutorService 轮询就够了，少一层依赖少一个坑。
}
